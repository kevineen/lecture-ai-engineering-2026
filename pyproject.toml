[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "AIE2026 演習・宿題用リポジトリ（学習支援エージェントを育てる）"
readme = "README.md"
requires-python = ">=3.12"
# 年度中に壊れないよう、バージョンは固定する
dependencies = [
    "google-genai==2.31.0",
    "openai==3.37.0",
    "pydantic-ai-slim[google,mcp]==2.57.0",  # mcp は第5回（MCP サーバー・クライアント）で使う
]

[dependency-groups]
dev = ["pytest>=8"]
# Streamlit UI（データセット作成・実験結果表示）
ui = ["streamlit>=1.40", "pandas>=2.2"]
# ローカル LoRA 学習（ノートブックの PINS に合わせる。torch は CUDA 版を別途）
finetune = [
    "transformers==5.18.0",
    "peft==0.21.1",
    "trl==1.14.2",
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "pandas>=2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
